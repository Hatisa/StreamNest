name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

# Least privilege by default: the build/smoke jobs only need to read the repo.
# Only the `release` job publishes, so it asks for `contents: write` on its own.
# A job-level `permissions` block fully replaces the workflow-level one for that
# job, so the release job below re-declares what it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build, test & package
    runs-on: ubuntu-latest
    # `secrets` is available here but NOT in a step-level `if`, so the presence
    # of a keystore is resolved once, at job scope, into a plain env var.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Optional. Without these secrets the release signing config falls back to
      # the debug key (see app/build.gradle.kts), so `assembleRelease` still
      # produces an APK that installs — which is what makes the smoke test and
      # the published artefact work on a fresh fork.
      - name: Decode signing keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # Informational: lint never blocks the APK (abortOnError=false), but the
      # report is worth having on every run.
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Assemble release APK (R8 enabled)
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamNest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamNest-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  # Installs and launches the *release* build on a real emulator. R8 shrinks and
  # obfuscates the app, and a keep-rule mistake shows up only at runtime — this
  # job is what turns "it compiled" into "it starts".
  smoke:
    name: Release smoke test (R8)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: StreamNest-release-apk
          path: apk

      # GitHub's Linux runners expose KVM; the emulator is unusable without it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          # android-emulator-runner executes each line of `script:` in its own
          # shell, so a variable set on one line is empty on the next — the
          # install below used to receive an empty APK path and fail. The logic
          # therefore lives in a file that is run in a single shell.
          script: bash "$GITHUB_WORKSPACE/.github/scripts/smoke-test.sh"

  release:
    name: Publish APKs to GitHub Releases
    needs: [ build, smoke ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that needs to write; it overrides the read-only default above.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.apk
          generate_release_notes: true
          body: |
            StreamNest APK 构建产物。

            - `StreamNest-release-apk`：经过 R8 压缩，并在模拟器上通过了「安装+启动」冒烟测试。
            - `StreamNest-debug-apk`：调试签名版本，便于排查问题。

            两种 APK 都可直接安装；首次安装需允许「安装未知来源应用」。

            本应用只提供播放与订阅管理功能，不内置任何频道内容。
